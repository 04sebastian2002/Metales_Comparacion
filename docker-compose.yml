services:
  # 1) El mensajero: broker + backend de resultados
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 2) La API web: solo encola tareas
  api:
    build: .
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - METALS_REDIS_URL=redis://redis:6379/2
    depends_on:
      - redis

  # 3) El worker: consume la cola y hace el trabajo pesado
  #    --concurrency=4 -> 4 procesos en paralelo (súbelo/bájalo según tu CPU)
  worker:
    build: .
    command: "celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=4"
    volumes:
      - .:/code
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - METALS_REDIS_URL=redis://redis:6379/2
    depends_on:
      - redis

  # 4) Beat: el "reloj" que lanza la actualización de precios de metales
  #    cada METALS_UPDATE_MINUTES minutos (el worker es quien la ejecuta)
  beat:
    build: .
    command: "celery -A app.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - METALS_UPDATE_MINUTES=15
    depends_on:
      - redis
      - worker

  # 5) Flower: panel web para monitorear las tareas (http://localhost:5555)
  flower:
    build: .
    command: "celery -A app.celery_app:celery_app flower --port=5555"
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - worker
